<div class="max-w-6xl mx-auto p-6 bg-white rounded-lg shadow mt-6">
  <div class="flex flex-col md:flex-row justify-between items-center mb-6">
    <h2 class="text-3xl font-bold text-gray-900">Registrar Nuevo Maestro</h2>
  </div>

  <form [formGroup]="formulario" (ngSubmit)="onSubmit()" class="max-w-md mx-auto bg-white p-6 border border-gray-200 rounded-lg shadow-sm">
    
    <!-- ID del Maestro -->
    <div class="relative z-0 w-full mb-5 group">
      <input
        type="text"
        name="idMaestro"
        id="idMaestro"
        class="block py-2.5 px-0 w-full text-sm text-gray-900 bg-transparent border-0 border-b-2 border-gray-300 appearance-none focus:outline-none focus:ring-0 focus:border-blue-600 peer"
        placeholder=" "
        formControlName="idMaestro"
      />
      <label
        for="idMaestro"
        class="peer-focus:font-medium absolute text-sm text-gray-500 duration-300 transform -translate-y-6 scale-75 top-3 -z-10 origin-[0] peer-focus:start-0 peer-focus:text-blue-600 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-6"
        >ID del Maestro (Ej: 1, 2, 4...)</label
      >
    </div>

    <!-- Nombre -->
    <div class="relative z-0 w-full mb-5 group">
      <input
        type="text"
        name="nombre"
        id="nombre"
        class="block py-2.5 px-0 w-full text-sm text-gray-900 bg-transparent border-0 border-b-2 border-gray-300 appearance-none focus:outline-none focus:ring-0 focus:border-blue-600 peer"
        placeholder=" "
        formControlName="nombre"
      />
      <label
        for="nombre"
        class="peer-focus:font-medium absolute text-sm text-gray-500 duration-300 transform -translate-y-6 scale-75 top-3 -z-10 origin-[0] peer-focus:start-0 peer-focus:text-blue-600 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-6"
        >Nombre</label
      >
    </div>

    <!-- Apellido Paterno -->
    <div class="relative z-0 w-full mb-5 group">
      <input
        type="text"
        name="apaterno"
        id="apaterno"
        class="block py-2.5 px-0 w-full text-sm text-gray-900 bg-transparent border-0 border-b-2 border-gray-300 appearance-none focus:outline-none focus:ring-0 focus:border-blue-600 peer"
        placeholder=" "
        formControlName="apaterno"
      />
      <label
        for="apaterno"
        class="peer-focus:font-medium absolute text-sm text-gray-500 duration-300 transform -translate-y-6 scale-75 top-3 -z-10 origin-[0] peer-focus:start-0 peer-focus:text-blue-600 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-6"
        >Apellido Paterno</label
      >
    </div>

    <!-- Apellido Materno -->
    <div class="relative z-0 w-full mb-5 group">
      <input
        type="text"
        name="amaterno"
        id="amaterno"
        class="block py-2.5 px-0 w-full text-sm text-gray-900 bg-transparent border-0 border-b-2 border-gray-300 appearance-none focus:outline-none focus:ring-0 focus:border-blue-600 peer"
        placeholder=" "
        formControlName="amaterno"
      />
      <label
        for="amaterno"
        class="peer-focus:font-medium absolute text-sm text-gray-500 duration-300 transform -translate-y-6 scale-75 top-3 -z-10 origin-[0] peer-focus:start-0 peer-focus:text-blue-600 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-6"
        >Apellido Materno</label
      >
    </div>

    <!-- Correo Electrónico -->
    <div class="relative z-0 w-full mb-5 group">
      <input
        type="email"
        name="correo"
        id="correo"
        class="block py-2.5 px-0 w-full text-sm text-gray-900 bg-transparent border-0 border-b-2 border-gray-300 appearance-none focus:outline-none focus:ring-0 focus:border-blue-600 peer"
        placeholder=" "
        formControlName="correo"
      />
      <label
        for="correo"
        class="peer-focus:font-medium absolute text-sm text-gray-500 duration-300 transform -translate-y-6 scale-75 top-3 -z-10 origin-[0] peer-focus:start-0 peer-focus:text-blue-600 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-6"
        >Correo Electrónico</label
      >
    </div>

    <!-- Botones de Acción -->
    <div class="flex items-center space-x-4">
      <button
        type="submit"
        class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center">
        Guardar Maestro
      </button>

      <button
        type="button"
        class="text-gray-700 bg-gray-100 hover:bg-gray-200 focus:ring-4 focus:outline-none focus:ring-gray-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center"
        [routerLink]="['/utl/maestros']">
        Cancelar
      </button>
    </div>

  </form>
</div>
