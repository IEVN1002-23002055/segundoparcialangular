<div class="max-w-6xl mx-auto p-6 bg-white rounded-lg shadow mt-6">

  <div class="flex justify-between items-center mb-6">
    <h1 class="text-3xl font-bold text-gray-900">Lista de Maestros</h1>
    <button 
      type="button" 
      routerLink="/utl/maestros/agregar"
      class="text-white bg-blue-700 hover:bg-blue-800 font-medium rounded-lg text-sm px-5 py-2.5 shadow-sm"
    >
      + Agregar Maestro
    </button>
  </div>

  <div class="mb-6 p-4 border border-gray-200 bg-gray-50 rounded-lg">
    <div class="flex flex-col md:flex-row items-center gap-4">
      <div class="w-full md:w-1/4">
        <label class="block mb-1 text-sm font-medium text-gray-900">Filtrar por nombre</label>
      </div>
      <div class="w-full md:w-3/4">
        <input 
          [(ngModel)]="listFilter" 
          type="text" 
          class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5" 
          placeholder="Escribe el nombre del maestro..."
        />
      </div>
    </div>
  </div>

  <div class="relative overflow-x-auto shadow-md sm:rounded-lg">
    <table class="w-full text-sm text-left text-gray-500">
      <thead class="text-xs text-gray-700 uppercase bg-gray-100">
        <tr>
          <th scope="col" class="px-6 py-3">ID</th>
          <th scope="col" class="px-6 py-3">Nombre</th>
          <th scope="col" class="px-6 py-3">Apellido Paterno</th>
          <th scope="col" class="px-6 py-3">Apellido Materno</th>
          <th scope="col" class="px-6 py-3">Correo</th>
          <th scope="col" class="px-6 py-3">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <!-- Aplicando el filtro por nombre con el pipe -->
        <tr *ngFor="let maestro of dataSource?.maestros | maestrosFilter : listFilter" class="bg-white border-b hover:bg-gray-50">
          <td class="px-6 py-4 font-medium text-gray-900 whitespace-nowrap">
            {{ maestro.idMaestro }}
          </td>
          <td class="px-6 py-4 font-medium text-gray-900">
            {{ maestro.nombre | uppercase }}
          </td>
          <td class="px-6 py-4">
            {{ maestro.apaterno }}
          </td>
          <td class="px-6 py-4">
            {{ maestro.amaterno }}
          </td>
          <td class="px-6 py-4 text-gray-500">
            {{ maestro.correo }}
          </td>
          <td class="px-6 py-4">
            <div class="flex gap-2">
              <!-- Botón Editar con idMaestro -->
              <a 
                [routerLink]="['/utl/maestros/editar', maestro.idMaestro]"
                class="px-3 py-1.5 text-xs font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg shadow-sm text-center inline-block cursor-pointer"
              >
                Editar
              </a>
              <!-- Botón Eliminar con idMaestro -->
              <a 
                [routerLink]="['/utl/maestros/eliminar', maestro.idMaestro]"
                class="px-3 py-1.5 text-xs font-medium text-white bg-red-600 hover:bg-red-700 rounded-lg shadow-sm text-center inline-block cursor-pointer"
              >
                Eliminar
              </a>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="!dataSource?.maestros || dataSource.maestros.length === 0" class="p-4 mt-4 text-sm text-gray-800 rounded-lg bg-gray-100" role="alert">
    <span class="font-medium">Información:</span> 
    No existen maestros registrados o cargando datos...
  </div>

</div>
