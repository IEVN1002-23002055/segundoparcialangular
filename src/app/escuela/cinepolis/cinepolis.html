<div class="max-w-2xl mx-auto p-6 bg-white rounded-lg shadow">

  <h1 class="text-3xl font-bold text-gray-900 mb-6">
    Cinépolis - Venta de Boletos
  </h1>

  <form [formGroup]="formulario" (ngSubmit)="procesar()">

    <div class="mb-5">
      <label for="nombre" class="block mb-2 text-sm font-medium text-gray-900">
        Nombre
      </label>

      <input
        type="text"
        id="nombre"
        formControlName="nombre"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        placeholder="Nombre del comprador"
      > 
    </div>

    <div class="mb-5">
      <label for="compradores" class="block mb-2 text-sm font-medium text-gray-900">
        Cantidad Compradores
      </label>

      <input
        type="number"
        id="compradores"
        formControlName="compradores"
        min="1"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
      >
    </div>

    <div class="mb-5">
      <label class="block mb-2 text-sm font-medium text-gray-900">
        Tarjeta Cinepolis
      </label>

      <div class="flex items-center space-x-6">
        <div class="flex items-center">
          <input
            id="cine-si"
            type="radio"
            value="si"
            formControlName="tarjetaCine"
            class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 focus:ring-blue-500"
          >
          <label for="cine-si" class="ms-2 text-sm font-medium text-gray-900">Sí</label>
        </div>

        <div class="flex items-center">
          <input
            id="cine-no"
            type="radio"
            value="no"
            formControlName="tarjetaCine"
            class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 focus:ring-blue-500"
          >
          <label for="cine-no" class="ms-2 text-sm font-medium text-gray-900">No</label>
        </div>
      </div>
    </div>

    <div class="mb-5">
      <label for="boletos" class="block mb-2 text-sm font-medium text-gray-900">
        Cantidad De Boletos
      </label>

      <input
        type="number"
        id="boletos"
        formControlName="boletos"
        min="1"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
      >
    </div>

    <div
      *ngIf="mensajeError"
      class="p-4 mb-4 text-sm text-red-800 rounded-lg bg-red-50"
      role="alert"
    >
      {{ mensajeError }}
    </div>

    <div class="flex justify-end mt-5">
      <button
        type="submit"
        class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5"
      >
        Procesar
      </button>
    </div>

  </form>

  <div *ngIf="valorPagar > 0" class="mt-6 border-t pt-4">
    <h2 class="text-xl font-bold text-gray-900 mb-2">Resumen de Compra:</h2>
    <p class="text-gray-700">Comprador: {{ nombre }}</p>
    <p class="text-gray-700 font-semibold mb-4">Valor a Pagar: ${{ valorPagar }}</p>

    <button
      type="button"
      (click)="verRegistros()"
      class="text-white bg-green-600 hover:bg-green-700 focus:ring-4 focus:outline-none focus:ring-green-300 font-medium rounded-lg text-sm px-5 py-2.5"
    >
      Ver Registros
    </button>
  </div>

</div>
